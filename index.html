<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Топ-гексагоны и сети</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: панель фильтров сверху, карта слева, справа — сводка по сетям и сравнение с моими топами */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1d2321; --muted:#68716d; --line:#dfe3e0; --soft:#f0f2f0;
  --money:#12936b; --users:#2c63d9; --merch:#e07a2b; --multi:#1d2321;
  --magnit:#d41f2c; --pyat:#e8b400; --perek:#0d5a3f;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a1f1d; --fg:#e8ece9; --muted:#97a19c; --line:#2c3431; --soft:#222826;
  --money:#2fbf8f; --users:#5b8bf0; --merch:#f29a52; --multi:#f2f4f3; --perek:#24a173; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a1f1d; --fg:#e8ece9; --muted:#97a19c; --line:#2c3431; --soft:#222826;
  --money:#2fbf8f; --users:#5b8bf0; --merch:#f29a52; --multi:#f2f4f3; --perek:#24a173; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:700;margin:0;margin-right:auto;text-wrap:balance}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-weight:500;padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
select{font:inherit;font-weight:500;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;width:100%}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--c);
  cursor:pointer;user-select:none;font-weight:500;font-size:13px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:10px;height:10px;border-radius:3px;border:2.5px solid var(--c)}
.chip .pin{width:12px;height:12px;border-radius:50%;background:var(--c);border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.chip .sw{width:12px;height:12px;border-radius:3px;background:linear-gradient(90deg,#fde0ef,#c51b8a,#49006a)}
.chip:has(input:checked){background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip:has(input:not(:checked)){opacity:.45;border-style:dashed}
.chip:has(input:focus-visible), button:focus-visible, select:focus-visible{outline:2px solid var(--users);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
.mapwrap{flex:1;min-width:0;position:relative}
#map{position:absolute;inset:0;background:var(--bg)}
.legendbox{position:absolute;left:12px;bottom:22px;z-index:800;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:12px;max-width:calc(100% - 24px)}
.legendbox .t{font-weight:600;margin-bottom:5px}
.scale{display:flex;gap:0}
.scale div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px}
.scale i{display:block;width:100%;height:12px;border:1px solid rgba(0,0,0,.08)}
.scale span{font:500 10px var(--mono);color:var(--muted);white-space:nowrap}
.legendbox .row2{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;color:var(--muted)}
.legendbox .row2 span{display:inline-flex;align-items:center;gap:5px}
.legendbox .o{width:12px;height:12px;border-radius:2px;border:2.5px solid var(--c)}
.legendbox .p{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legendbox .ph{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);background:transparent}
aside{width:380px;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px 24px}
aside h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
aside h2:first-child{margin-top:0}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
table.t th{font-weight:500;color:var(--muted);text-align:right;font-size:11px;padding:0 0 4px 6px}
table.t th:first-child{text-align:left;padding-left:0}
table.t td{padding:4px 0 4px 6px;text-align:right;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px}
table.t td:first-child{text-align:left;padding-left:0;font-family:var(--sans);font-size:13px}
table.t tr.tot td{font-weight:600}
.cn{display:inline-flex;align-items:center;gap:6px}
.cn i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.cov{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cov div{border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.cov b{display:block;font:600 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.cov span{font-size:12px;color:var(--muted)}
.bar2{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--fg)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.lst{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:24px 1fr auto;gap:2px 8px;align-items:center;padding:6px;border-radius:6px;cursor:pointer}
.it:hover{background:var(--soft)}
.it .n{font:500 11px var(--mono);color:var(--muted);text-align:right}
.it .v{font:600 12px var(--mono);font-variant-numeric:tabular-nums}
.it .s{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 10px;font:500 11px var(--mono);color:var(--muted)}
.it .hx{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{display:inline-flex;align-items:center;font:600 10px/1 var(--mono);padding:2px 4px;border-radius:3px;color:#fff;background:var(--c)}
.tag.none{background:transparent;color:var(--muted);border:1px solid var(--line)}
.lbl{display:flex;gap:2px;transform:translate(-50%,-50%);width:max-content;pointer-events:none}
.lbl b{font:600 10px/1 var(--mono);color:#fff;background:var(--c);padding:2px 3px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.leaflet-tooltip.tt{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  box-shadow:0 6px 24px rgba(0,0,0,.18);font:13px/1.45 var(--sans);min-width:240px;white-space:normal}
.leaflet-tooltip.tt::before{display:none}
.tt .top{display:flex;align-items:center;gap:6px;font-weight:600}
.tt .top i{width:10px;height:10px;border-radius:2px;border:2.5px solid var(--c)}
.tt table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tt td{padding:1px 0;vertical-align:top}
.tt td+td{text-align:right;font-weight:600;padding-left:12px;white-space:nowrap}
.tt .sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 3px}
.tt .sec:first-child{margin-top:0}
.tt .sub{color:var(--muted);font-weight:400}
.tt .id{font:11px var(--mono);color:var(--muted);margin-top:6px}
.tt .ad{font-size:12px;color:var(--muted);max-width:280px}
.leaflet-container{font-family:var(--sans)}
.tiles-light{filter:grayscale(.9) brightness(1.05)}
.tiles-dark{filter:grayscale(1) invert(1) brightness(.85) contrast(.9)}
@media (max-width:820px){
  main{flex-direction:column}
  .mapwrap{flex:none;height:64vh}
  aside{width:auto;border-left:0;border-top:1px solid var(--line)}
  body{height:auto}
}
</style>
</head>
<body>
<header>
  <h1>Топ-гексагоны и сети<small>H3, разрешение 8 (≈0,7 км²) · сети в радиусе 30 км от центра города</small></h1>
  <div class="seg" role="group" aria-label="Город">
    <button id="city-msk" data-city="msk" aria-pressed="true">Москва</button>
    <button id="city-spb" data-city="spb" aria-pressed="false">Петербург</button>
  </div>
  <div class="bar">
    <div class="group" id="g-chains">
      <span class="cap">Сети</span>
      <label class="chip" style="--c:var(--magnit)"><input type="checkbox" id="c0" value="0" checked><span class="pin"></span>Магнит</label>
      <label class="chip" style="--c:var(--pyat)"><input type="checkbox" id="c1" value="1" checked><span class="pin"></span>Пятёрочка</label>
      <label class="chip" style="--c:var(--perek)"><input type="checkbox" id="c2" value="2" checked><span class="pin"></span>Перекрёсток</label>
    </div>
    <div class="group">
      <span class="cap">Заливка сетки</span>
      <select id="metric" aria-label="Чем красить гексагоны">
        <option value="spend">Сумма трат</option>
        <option value="cnt">Число точек</option>
        <option value="none">Без заливки</option>
      </select>
      <label class="chip" style="--c:var(--fg)"><input type="checkbox" id="showPts" checked><span class="pin" style="--c:var(--muted)"></span>Точки</label>
    </div>
    <div class="group" id="g-tops">
      <span class="cap">Мои топы</span>
      <select id="month" aria-label="Месяц топов"></select>
      <label class="chip" style="--c:var(--money)"><input type="checkbox" id="t-money" value="money" checked><span class="dot"></span>Деньги</label>
      <label class="chip" style="--c:var(--users)"><input type="checkbox" id="t-users" value="users" checked><span class="dot"></span>Клиенты</label>
      <label class="chip" style="--c:var(--merch)"><input type="checkbox" id="t-merch" value="merch" checked><span class="dot"></span>Мерчи</label>
    </div>
  </div>
</header>
<main>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legendbox" id="legend"></div>
  </div>
  <aside id="side"></aside>
</main>

  users:{name:"Топ по клиентам", short:"К", v:"--users"},
  merch:{name:"Топ по мерчам",  short:"М", v:"--merch"}
};
const MONTHS = {"2026-05":"Май","2026-06":"Июнь","2026-07":"Июль","2026-08":"Август","2026-09":"Сентябрь"};
const PAL = ["#fde0ef","#fbb4d4","#f580b8","#e2479e","#c51b8a","#8e0f7a","#49006a"];

const state = {city:"msk", chains:new Set([0,1,2]), metric:"spend", pts:true, month:"2026-09", tops:new Set(["money","users","merch"])};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtInt = n => n.toLocaleString("ru-RU");
const fmtRub = n => n>=1e9 ? (n/1e9).toLocaleString("ru-RU",{maximumFractionDigits:2})+" млрд ₽"
  : n>=1e6 ? (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн ₽"
  : n>=1e3 ? Math.round(n/1e3).toLocaleString("ru-RU")+" тыс ₽" : Math.round(n)+" ₽";
const short = n => n>=1e6 ? (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн" : Math.round(n/1e3)+" тыс";
const pct = (a,b) => b ? (100*a/b).toLocaleString("ru-RU",{maximumFractionDigits:1})+"%" : "—";
const plural = (n,a,b,c) => {const m=n%10,h=n%100; return m===1&&h!==11?a: m>=2&&m<=4&&(h<12||h>14)?b:c};

// месяцы
const sel = document.getElementById("month");
Object.entries(MONTHS).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v+" 2026";sel.appendChild(o)});
sel.value = state.month;

// карта
const map = L.map("map",{preferCanvas:true});
const dark = document.documentElement.dataset.theme==="dark" ||
  (matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme!=="light");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, className: dark?"tiles-dark":"tiles-light",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
map.createPane("grid").style.zIndex=400;
map.createPane("tops").style.zIndex=420;
map.createPane("pts").style.zIndex=440;
map.createPane("lbl").style.zIndex=460;
const rGrid = L.canvas({pane:"grid", padding:.3}), rTops = L.canvas({pane:"tops", padding:.3}), rPts = L.canvas({pane:"pts", padding:.3});
const gridLayer = L.layerGroup().addTo(map), topLayer = L.layerGroup().addTo(map), ptLayer = L.layerGroup().addTo(map), lblLayer = L.layerGroup().addTo(map);

// ---------- подготовка данных по городу ----------
const cache = {};
function circlePoly([lat,lon], rKm){
  const out=[]; for(let i=0;i<72;i++){const a=2*Math.PI*i/72;
    out.push([lat + rKm/110.57*Math.sin(a), lon + rKm/(111.32*Math.cos(lat*Math.PI/180))*Math.cos(a)]);}
  return out;
}
function prep(city){
  if (cache[city]) return cache[city];
  const cfg = CITY[city];
  const grid = h3.polygonToCells(circlePoly(cfg.c, cfg.r), 8);
  const pts = PTS[city].map(p=>({la:p[0], lo:p[1], ch:p[2], sp:p[3], ad:p[4], h:h3.latLngToCell(p[0],p[1],8)}));
  const byHex = {};
  for (const p of pts) (byHex[p.h] ||= []).push(p);
  const bounds = {};
  const B = h => bounds[h] ||= h3.cellToBoundary(h);
  return cache[city] = {grid, pts, byHex, B};
}

// агрегат по гексагону с учётом выбранных сетей
function agg(list){
  const a = {n:0, ns:0, sum:0, per:[0,1,2].map(()=>({n:0, ns:0, sum:0}))};
  for (const p of list||[]){
    if (!state.chains.has(p.ch)) continue;
    const c=a.per[p.ch]; a.n++; c.n++;
    if (p.sp>=0){a.ns++; a.sum+=p.sp; c.ns++; c.sum+=p.sp;}
  }
  return a;
}

// мои топы за выбранный месяц
function myTops(){
  const by = {};
  for (const r of ROWS){
    if (r.c!==state.city || r.m!==state.month || !state.tops.has(r.t)) continue;
    const h = by[r.h] ||= {hex:r.h, tops:{}, m:{}};
    h.tops[r.t]=r.p;
    for (const k of ["gmv","u","mc","pt","tx","sme","big"]) if (r[k]!=null) h.m[k]=r[k];
  }
  return by;
}

// ---------- шкала заливки ----------
function breaks(vals){
  if (state.metric==="cnt") return [1,2,3,4,6,10];
  const s = vals.filter(v=>v>0).sort((a,b)=>a-b); if (!s.length) return [];
  const q = []; for (let i=1;i<PAL.length;i++) q.push(s[Math.floor(s.length*i/PAL.length)]);
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))-1); return Math.round(v/p)*p; };
  return [...new Set(q.map(nice))];
}
function colorFor(v, br){
  if (state.metric==="cnt"){ let i=0; while(i<br.length-1 && v>=br[i+1]) i++; return PAL[Math.min(i+1, PAL.length-1)]; }
  let i=0; while(i<br.length && v>=br[i]) i++; return PAL[Math.min(i, PAL.length-1)];
}

// ---------- тултипы ----------
function chainBlock(a){
  const rows = [0,1,2].filter(i=>state.chains.has(i)).map(i=>{const c=a.per[i];
    return `<tr><td><span class="cn" style="--c:var(${CH[i].v})"><i></i>${CH[i].name}</span></td>
      <td>${c.n} ${c.n?`<span class="sub">· с тратами ${c.ns}</span>`:""}</td><td>${c.ns?fmtRub(c.sum):"—"}</td></tr>`}).join("");
  return `<div class="sec">Сети в гексагоне</div>
    <table>${rows}<tr><td><b>Итого</b></td><td>${a.n}</td><td>${a.ns?fmtRub(a.sum):"—"}</td></tr></table>
    ${a.n>a.ns?`<div class="sub" style="font-size:12px;margin-top:4px">У ${a.n-a.ns} ${plural(a.n-a.ns,"точки","точек","точек")} нет данных о тратах — в сумму не вошли</div>`:""}`;
}
function topBlock(t){
  if (!t) return "";
  const tops = Object.entries(t.tops).sort((a,b)=>a[1]-b[1])
    .map(([k,p])=>`<div class="top" style="--c:var(${TOPS[k].v})"><i></i>${TOPS[k].name} — №${p}</div>`).join("");
  const m=t.m, rows=[["Клиенты",fmtInt(m.u)],["Деньги (оборот)",fmtRub(m.gmv)],["Мерчанты",fmtInt(m.mc)],["Торговые точки",fmtInt(m.pt)]];
  if (m.tx!=null) rows.push(["Транзакции",fmtInt(m.tx)]);
  return `<div class="sec">Мой топ · ${MONTHS[state.month].toLowerCase()}</div>${tops}
    <table style="margin-top:4px">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>`;
}
function hexTip(h, a, t){ return `${topBlock(t)}${chainBlock(a)}<div class="id">${h}</div>`; }
function ptTip(p){
  const c=CH[p.ch];
  return `<div class="top" style="--c:var(${c.v})"><span class="cn" style="--c:var(${c.v})"><i></i></span>${c.name}</div>
    <div class="ad">${p.ad || "адрес не указан"}</div>
    <table style="margin-top:6px"><tr><td>Траты за месяц</td><td>${p.sp>=0?fmtRub(p.sp):"нет данных"}</td></tr></table>`;
}

// ---------- отрисовка ----------
let current = null;
const PT_ZOOM = 13;
function renderPts(){
  ptLayer.clearLayers();
  if (!state.pts || map.getZoom() < PT_ZOOM) return;
  const D = prep(state.city), cols = CH.map(c=>css(c.v)), white = css("--panel");
  for (const p of D.pts){
    if (!state.chains.has(p.ch)) continue;
    const has = p.sp>=0;
    L.circleMarker([p.la,p.lo],{renderer:rPts, pane:"pts", radius: has?5:4, weight: has?1.2:1.8,
      color: has? white : cols[p.ch], fillColor: cols[p.ch], fillOpacity: has? .95 : 0})
      .bindTooltip(()=>ptTip(p),{className:"tt", direction:"top", offset:[0,-4]}).addTo(ptLayer);
  }
}
let lastZoomOk = null;
map.on("zoomend",()=>{ const ok = map.getZoom()>=PT_ZOOM; if (ok!==lastZoomOk){ lastZoomOk=ok; renderPts(); renderLegend(current?current.br:[]); } });
function render(){
  const D = prep(state.city);
  const T = myTops();
  gridLayer.clearLayers(); topLayer.clearLayers(); ptLayer.clearLayers(); lblLayer.clearLayers();

  const A = {}; for (const h of D.grid) A[h]=agg(D.byHex[h]);
  for (const h in D.byHex) if (!A[h]) A[h]=agg(D.byHex[h]);   // точки на краю круга
  const vals = Object.values(A).map(a=>state.metric==="cnt"?a.n:a.sum);
  const br = breaks(vals);
  const line = css("--line");

  // сетка всего города
  for (const h of Object.keys(A)){
    const a=A[h], v = state.metric==="cnt"?a.n:a.sum;
    const filled = state.metric!=="none" && v>0;
    const poly = L.polygon(D.B(h),{renderer:rGrid, pane:"grid", weight:.6, color: filled? "rgba(73,0,106,.35)" : line,
      fill:true, fillColor: filled? colorFor(v,br) : "#000", fillOpacity: filled? .62 : 0, interactive: a.n>0});
    if (a.n>0) poly.bindTooltip(()=>hexTip(h,A[h],T[h]),{className:"tt", sticky:true, direction:"top", offset:[0,-8]});
    poly.addTo(gridLayer);
  }

  // мои топы — жирный контур поверх заливки
  for (const h in T){
    const t=T[h], keys=Object.keys(t.tops);
    const col = keys.length>1 ? css("--multi") : css(TOPS[keys[0]].v);
    const poly = L.polygon(h3.cellToBoundary(h),{renderer:rTops, pane:"tops", color:col, weight:3.5, fill:true, fillOpacity:0, fillColor:col});
    poly.bindTooltip(()=>hexTip(h, A[h]||agg([]), t),{className:"tt", sticky:true, direction:"top", offset:[0,-8]});
    poly.on("mouseover",()=>poly.setStyle({weight:6})); poly.on("mouseout",()=>poly.setStyle({weight:3.5}));
    poly.addTo(topLayer);
    const badges = ["money","users","merch"].filter(k=>t.tops[k]).map(k=>`<b style="--c:var(${TOPS[k].v})">${TOPS[k].short}${t.tops[k]}</b>`).join("");
    L.marker(h3.cellToLatLng(h),{pane:"lbl", interactive:false, icon:L.divIcon({className:"", html:`<div class="lbl">${badges}</div>`, iconSize:[0,0]})}).addTo(lblLayer);
  }

  renderPts();
  current = {A, T, br};
  renderLegend(br); renderSide(D, A, T);
}

function renderLegend(br){
  const el = document.getElementById("legend");
  let scale = "";
  if (state.metric==="spend" && br.length){
    const edges=[0,...br];
    scale = `<div class="t">Траты сетей в гексагоне за месяц</div><div class="scale">` +
      PAL.slice(0, edges.length).map((c,i)=>`<div><i style="background:${c}"></i><span>${i===0?"<"+short(br[0]):"≥"+short(edges[i])}</span></div>`).join("") + `</div>`;
  } else if (state.metric==="cnt"){
    const lab=["1","2","3","4–5","6–9","10+"];
    scale = `<div class="t">Точек сетей в гексагоне</div><div class="scale">` +
      lab.map((l,i)=>`<div><i style="background:${PAL[i+1]}"></i><span>${l}</span></div>`).join("") + `</div>`;
  }
  el.innerHTML = scale + `<div class="row2">
    <span><i class="o" style="--c:var(--money)"></i>топ деньги</span><span><i class="o" style="--c:var(--users)"></i>клиенты</span>
    <span><i class="o" style="--c:var(--merch)"></i>мерчи</span><span><i class="o" style="--c:var(--multi)"></i>несколько топов</span>
    <span><i class="p" style="--c:var(--muted)"></i>точка с тратами</span><span><i class="ph"></i>без данных о тратах</span></div>
    ${state.pts && map.getZoom()<PT_ZOOM ? `<div class="row2" style="margin-top:4px">Точки магазинов появятся при приближении</div>` : ""}`;
}

function renderSide(D, A, T){
  const side = document.getElementById("side");
  const chs = [0,1,2].filter(i=>state.chains.has(i));
  // итоги по городу
  const tot = agg(D.pts);
  let h = `<h2>Сети в радиусе 30 км · ${state.city==="msk"?"Москва":"Петербург"}</h2>
  <table class="t"><tr><th>Сеть</th><th>Точек</th><th>С тратами</th><th>Траты / мес</th></tr>` +
  chs.map(i=>{const c=tot.per[i]; return `<tr><td><span class="cn" style="--c:var(${CH[i].v})"><i></i>${CH[i].name}</span></td>
    <td>${fmtInt(c.n)}</td><td>${fmtInt(c.ns)}</td><td>${fmtRub(c.sum)}</td></tr>`}).join("") +
  `<tr class="tot"><td>Итого</td><td>${fmtInt(tot.n)}</td><td>${fmtInt(tot.ns)}</td><td>${fmtRub(tot.sum)}</td></tr></table>
  <p class="note">Гексагонов с точками сетей: ${fmtInt(Object.values(A).filter(a=>a.n>0).length)} из ${fmtInt(Object.keys(A).length)} в сетке.</p>`;

  // пересечение с моими топами
  const topHexes = Object.keys(T);
  let inN=0, inS=0, inSum=0, empty=0;
  for (const x of topHexes){ const a=A[x]||agg([]); inN+=a.n; inS+=a.ns; inSum+=a.sum; if(!a.n) empty++; }
  h += `<h2>Мои топы (${MONTHS[state.month].toLowerCase()}) и сети</h2>
  <div class="cov">
    <div><b>${pct(inSum,tot.sum)}</b><span>трат сетей приходится на мои ${topHexes.length} топ-гексагонов</span><div class="bar2"><i style="width:${tot.sum?100*inSum/tot.sum:0}%"></i></div></div>
    <div><b>${pct(inN,tot.n)}</b><span>точек сетей стоят в моих топ-гексагонах</span><div class="bar2"><i style="width:${tot.n?100*inN/tot.n:0}%"></i></div></div>
  </div>
  <p class="note">В топ-гексагонах: ${fmtInt(inN)} ${plural(inN,"точка","точки","точек")} сетей, траты ${fmtRub(inSum)}. Без единой точки выбранных сетей: ${empty} из ${topHexes.length}.</p>`;

  // топ гексагонов по тратам сетей
  const ranked = Object.entries(A).filter(([,a])=>a.sum>0).sort((x,y)=>y[1].sum-x[1].sum).slice(0,20);
  const sumTop20 = ranked.reduce((s,[,a])=>s+a.sum,0);
  const covered = ranked.filter(([x])=>T[x]).length;
  h += `<h2>20 гексагонов с наибольшими тратами в сетях</h2>
  <p class="note" style="margin-top:0">Из них в моих топах: <b>${covered}</b> из 20. На эти 20 гексагонов приходится ${pct(sumTop20,tot.sum)} всех трат.</p><div class="lst">` +
  ranked.map(([x,a],i)=>{
    const t=T[x];
    const tags = t ? ["money","users","merch"].filter(k=>t.tops[k]).map(k=>`<span class="tag" style="--c:var(${TOPS[k].v})">${TOPS[k].short}${t.tops[k]}</span>`).join(" ")
                   : `<span class="tag none">не в топе</span>`;
    return `<div class="it" data-hex="${x}" tabindex="0"><span class="n">${i+1}</span><span class="hx">${tags}</span><span class="v">${fmtRub(a.sum)}</span>
      <span class="s">${chs.map(c=>`<span class="cn" style="--c:var(${CH[c].v})"><i></i>${a.per[c].n}</span>`).join("")}<span>${a.n} ${plural(a.n,"точка","точки","точек")}</span></span></div>`;
  }).join("") + `</div>`;

  h += `<h2>Как читать</h2><p class="note">Цвет гексагона — сумма трат (или число точек) выбранных сетей. Жирный контур — мои топ-гексагоны за выбранный месяц. Залитый кружок — точка с тратами, пустой — точка без данных о тратах: она есть на карте и в количестве, но в сумму не входит. Точки взяты по координатам в радиусе 30 км от центра, поэтому сюда попадают и ближние пригороды. Клик по строке — перелёт к гексагону.</p>`;
  side.innerHTML = h;
  side.querySelectorAll(".it").forEach(el=>{
    const go=()=>{const c=h3.cellToLatLng(el.dataset.hex); map.flyTo(c,15,{duration:.6});};
    el.addEventListener("click",go); el.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  });
}

function fitCity(){
  const c=CITY[state.city]; map.fitBounds(L.latLngBounds(circlePoly(c.c, c.r*0.62)));
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  state.city=b.dataset.city; document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  fitCity(); render();
}));
document.querySelectorAll("#g-chains input").forEach(i=>i.addEventListener("change",()=>{
  const v=+i.value; i.checked?state.chains.add(v):state.chains.delete(v); render();
}));
document.querySelectorAll("#g-tops input").forEach(i=>i.addEventListener("change",()=>{
  i.checked?state.tops.add(i.value):state.tops.delete(i.value); render();
}));
document.getElementById("metric").addEventListener("change",e=>{state.metric=e.target.value; render();});
document.getElementById("showPts").addEventListener("change",e=>{state.pts=e.target.checked; render();});
sel.addEventListener("change",()=>{state.month=sel.value; render();});
fitCity(); render();
</script>
</body>
</html>
