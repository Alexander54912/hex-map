<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Топ-гексагоны Москвы и Петербурга</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: верхняя панель фильтров, карта на всю высоту, справа список топ-10 (на телефоне — под картой) */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1d2321; --muted:#68716d; --line:#dfe3e0;
  --money:#12936b; --users:#2c63d9; --merch:#e07a2b; --multi:#7a4fd0;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a1f1d; --fg:#e8ece9; --muted:#97a19c; --line:#2c3431;
  --money:#2fbf8f; --users:#5b8bf0; --merch:#f29a52; --multi:#a07cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a1f1d; --fg:#e8ece9; --muted:#97a19c; --line:#2c3431;
  --money:#2fbf8f; --users:#5b8bf0; --merch:#f29a52; --multi:#a07cf0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:700;margin:0;margin-right:auto;text-wrap:balance}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-weight:500;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
select{font:inherit;font-weight:500;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.layers{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--c);
  cursor:pointer;user-select:none;font-weight:500}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chip:has(input:checked){background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip:has(input:not(:checked)){opacity:.45;border-style:dashed}
.chip:has(input:focus-visible), button:focus-visible, select:focus-visible{outline:2px solid var(--users);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#map{flex:1;min-width:0;background:var(--bg)}
aside{width:330px;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px}
aside h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
aside h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.row .pl{font:500 12px var(--mono);color:#fff;background:var(--c);border-radius:5px;text-align:center;padding:2px 0}
.row .v{font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.row .hx{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.note{font-size:12px;color:var(--muted);margin-top:14px}
/* подписи мест на карте */
.lbl{display:flex;gap:2px;transform:translate(-50%,-50%);width:max-content;pointer-events:none}
.lbl b{font:600 10px/1 var(--mono);color:#fff;background:var(--c);padding:2px 3px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
/* тултип */
.leaflet-tooltip.tt{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  box-shadow:0 6px 24px rgba(0,0,0,.18);font:13px/1.45 var(--sans);min-width:220px}
.leaflet-tooltip.tt::before{display:none}
.tt .tops{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.tt .top{display:flex;align-items:center;gap:6px;font-weight:600}
.tt .top i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tt table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tt td{padding:1px 0}
.tt td:last-child{text-align:right;font-weight:600;padding-left:14px}
.tt .id{font:11px var(--mono);color:var(--muted);margin-top:6px}
.leaflet-container{font-family:var(--sans)}
.tiles-light{filter:grayscale(.85) brightness(1.04)}
.tiles-dark{filter:grayscale(1) invert(1) brightness(.9) contrast(.9)}
@media (max-width:760px){
  main{flex-direction:column}
  #map{flex:none;height:62vh}
  aside{width:auto;border-left:0;border-top:1px solid var(--line)}
  body{height:auto}
}
</style>
</head>
<body>
<header>
  <h1>Топ-гексагоны по городам<small>H3, разрешение 8 · ≈0,7 км² · топ-10 на город за месяц</small></h1>
  <div class="seg" role="group" aria-label="Город">
    <button id="city-msk" data-city="msk" aria-pressed="true">Москва</button>
    <button id="city-spb" data-city="spb" aria-pressed="false">Петербург</button>
  </div>
  <select id="month" aria-label="Месяц"></select>
  <div class="layers">
    <label class="chip" style="--c:var(--money)"><input type="checkbox" id="l-money" value="money" checked><span class="dot"></span>По деньгам</label>
    <label class="chip" style="--c:var(--users)"><input type="checkbox" id="l-users" value="users" checked><span class="dot"></span>По клиентам</label>
    <label class="chip" style="--c:var(--merch)"><input type="checkbox" id="l-merch" value="merch" checked><span class="dot"></span>По мерчам</label>
  </div>
</header>
<main>
  <div id="map"></div>
  <aside id="side"></aside>
</main>

const CENTERS = {"881106a99bfffff": [60.055369, 30.42613], "8811aa6ab9fffff": [55.750179, 37.872562], "881106ab53fffff": [60.030402, 30.230328], "8811060601fffff": [59.935723, 30.350235], "8811aa7ab1fffff": [55.761431, 37.632341], "8811060641fffff": [59.934972, 30.312363], "8811aa78ddfffff": [55.754504, 37.656983], "8811aa7abdfffff": [55.756574, 37.620934], "8811060457fffff": [59.934824, 30.439498], "8811aa6a87fffff": [55.74534, 37.861107], "88110615bbfffff": [59.906025, 30.309067], "8811aa7ad7fffff": [55.780127, 37.594452], "8811aa7ad5fffff": [55.775266, 37.583048], "88110605c3fffff": [59.907275, 30.511879], "88110610d1fffff": [59.838791, 30.102987], "8811aa6805fffff": [55.682194, 37.855735], "8811060663fffff": [59.922428, 30.341837], "8811aa7a83fffff": [55.768352, 37.607696], "8811aa700dfffff": [55.840972, 37.492049], "881106060dfffff": [59.930256, 30.339301], "8811aa7ab9fffff": [55.764892, 37.620019], "881106a8a7fffff": [60.063195, 30.423601], "881106ab69fffff": [59.990519, 30.20525], "8811aa7a85fffff": [55.755175, 37.597211], "8811aa7a87fffff": [55.760034, 37.608613], "8811aa6b47fffff": [55.655278, 37.751202], "8811aa712bfffff": [55.775896, 37.523281], "88110614bbfffff": [59.9608, 30.291253], "881106aa2dfffff": [60.038219, 30.227761], "8811aa7ae3fffff": [55.750315, 37.585813], "8811aa7ab7fffff": [55.757968, 37.644663], "8811aa7067fffff": [55.82435, 37.493932], "8811aa4e93fffff": [55.660111, 37.476745], "881106ab5bfffff": [60.032741, 30.216827], "8811aa6833fffff": [55.693209, 37.902363], "8811aa78c7fffff": [55.737863, 37.658798], "8811aa7a11fffff": [55.747501, 37.538398], "8811aa6ad7fffff": [55.765484, 37.847045], "8811aa6b09fffff": [55.660123, 37.762609], "8811060607fffff": [59.933362, 30.363706], "8811060603fffff": [59.94119, 30.361173], "8811aa7a81fffff": [55.763492, 37.596292], "88110614abfffff": [59.942034, 30.271955], "8811060605fffff": [59.927895, 30.352769], "881106a95dfffff": [60.003034, 30.302932], "8811aa62d9fffff": [55.913282, 37.723533], "881106a993fffff": [60.053007, 30.439651], "8811060647fffff": [59.932615, 30.325832], "8811060645fffff": [59.927146, 30.314905], "8811aa6d63fffff": [55.745031, 38.004704], "8811aa632dfffff": [55.772533, 37.678913], "8811060643fffff": [59.940441, 30.323292], "8811aa75a5fffff": [55.919525, 37.758855], "8811aa0995fffff": [55.845508, 37.360099], "8811aa7139fffff": [55.789075, 37.533741], "8811aa682bfffff": [55.678701, 37.868037], "881106066dfffff": [59.911493, 30.319986], "881106a9e3fffff": [60.015488, 30.400768], "881181b653fffff": [55.613738, 37.612785], "881106324dfffff": [60.060835, 30.437125], "881106062bfffff": [59.925533, 30.366238], "8811aa68e5fffff": [55.698043, 37.913812]};

const TOPS = {
  money:{name:"Топ по деньгам", short:"Д", c:"var(--money)"},
  users:{name:"Топ по клиентам", short:"К", c:"var(--users)"},
  merch:{name:"Топ по мерчам",  short:"М", c:"var(--merch)"}
};
const CITY = {msk:{center:[55.76,37.66],zoom:11}, spb:{center:[59.97,30.34],zoom:11}};
const MONTHS = {"2026-05":"Май 2026","2026-06":"Июнь 2026","2026-07":"Июль 2026","2026-08":"Август 2026","2026-09":"Сентябрь 2026"};

const state = {city:"msk", month:"2026-09", layers:new Set(["money","users","merch"])};

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtInt = n => n.toLocaleString("ru-RU");
const fmtRub = n => (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1}) + " млн ₽";

// месяц
const sel = document.getElementById("month");
Object.entries(MONTHS).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v;sel.appendChild(o)});
sel.value = state.month;

// карта
const map = L.map("map",{zoomControl:true}).setView(CITY.msk.center, CITY.msk.zoom);
const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme!=="light"
          || document.documentElement.dataset.theme==="dark";
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, className: dark ? "tiles-dark" : "tiles-light",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const layer = L.layerGroup().addTo(map);
const polyByHex = {};

function currentHexes(){
  // собираем по каждому гексагону: в каких топах он и на каком месте
  const by = {};
  for (const r of ROWS){
    if (r.c!==state.city || r.m!==state.month || !state.layers.has(r.t)) continue;
    const h = by[r.h] ||= {hex:r.h, tops:{}, m:{}};
    h.tops[r.t] = r.p;
    // метрики одинаковые для гексагона в месяце; транзакции и типы точек есть не во всех файлах
    for (const k of ["gmv","u","mc","pt","tx","sme","big"]) if (r[k]!=null) h.m[k]=r[k];
  }
  return Object.values(by);
}

function tooltipHtml(h){
  const tops = Object.entries(h.tops).sort((a,b)=>a[1]-b[1])
    .map(([t,p])=>`<div class="top" style="--c:${TOPS[t].c}"><i></i>${TOPS[t].name} — №${p}</div>`).join("");
  const m = h.m;
  const rows = [
    ["Клиенты", fmtInt(m.u)],
    ["Деньги (оборот)", fmtRub(m.gmv)],
    ["Мерчанты", fmtInt(m.mc)],
    ["Торговые точки", fmtInt(m.pt)],
  ];
  if (m.tx!=null) rows.push(["Транзакции", fmtInt(m.tx)]);
  if (m.sme!=null) rows.push(["Точки МСБ / крупн.", `${m.sme} / ${m.big}`]);
  return `<div class="tops">${tops}</div><table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><div class="id">${h.hex}</div>`;
}

function render(){
  layer.clearLayers();
  for (const k in polyByHex) delete polyByHex[k];
  const list = currentHexes();
  for (const h of list){
    const keys = Object.keys(h.tops);
    const best = Math.min(...Object.values(h.tops));
    const color = keys.length>1 ? css("--multi") : css(TOPS[keys[0]].c.slice(4,-1));
    const poly = L.polygon(BOUNDS[h.hex],{
      color, weight:2, fillColor:color, fillOpacity: 0.62 - (best-1)*0.035
    }).bindTooltip(tooltipHtml(h),{className:"tt", sticky:true, direction:"top", offset:[0,-8]});
    poly.on("mouseover",()=>poly.setStyle({weight:4}));
    poly.on("mouseout",()=>poly.setStyle({weight:2}));
    poly.addTo(layer);
    polyByHex[h.hex]=poly;
    // бейджи с местами в центре гексагона
    const badges = ["money","users","merch"].filter(t=>h.tops[t])
      .map(t=>`<b style="--c:${TOPS[t].c}">${TOPS[t].short}${h.tops[t]}</b>`).join("");
    L.marker(CENTERS[h.hex],{interactive:false, icon:L.divIcon({className:"", html:`<div class="lbl">${badges}</div>`, iconSize:[0,0]})}).addTo(layer);
  }
  renderSide(list);
}

function renderSide(list){
  const side = document.getElementById("side");
  let html = `<div class="legend">
    <span style="--c:var(--money)"><i></i>деньги</span><span style="--c:var(--users)"><i></i>клиенты</span>
    <span style="--c:var(--merch)"><i></i>мерчи</span><span style="--c:var(--multi)"><i></i>в нескольких топах</span></div>`;
  const metric = {money:h=>fmtRub(h.m.gmv), users:h=>fmtInt(h.m.u)+" кл.", merch:h=>h.m.mc+" мерч."};
  for (const t of ["money","users","merch"]){
    if (!state.layers.has(t)) continue;
    const items = list.filter(h=>h.tops[t]).sort((a,b)=>a.tops[t]-b.tops[t]);
    html += `<h2>${TOPS[t].name}</h2>`;
    html += items.map(h=>`<div class="row" data-hex="${h.hex}" style="--c:${TOPS[t].c}" tabindex="0">
      <span class="pl">${h.tops[t]}</span><span class="hx">${h.hex}</span><span class="v">${metric[t](h)}</span></div>`).join("");
  }
  html += `<p class="note">Наведи на гексагон — увидишь, в каких он топах и сколько там клиентов, денег и мерчей. Клик по строке — перелёт к гексагону. Подписи: Д — деньги, К — клиенты, М — мерчи, цифра — место.</p>`;
  side.innerHTML = html;
  side.querySelectorAll(".row").forEach(el=>{
    const go=()=>{const p=polyByHex[el.dataset.hex]; map.flyTo(CENTERS[el.dataset.hex],14,{duration:.6}); setTimeout(()=>p.openTooltip(CENTERS[el.dataset.hex]),650)};
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  });
}

document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  state.city=b.dataset.city;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  fitCity();
  render();
}));
sel.addEventListener("change",()=>{state.month=sel.value;render()});
document.querySelectorAll(".layers input").forEach(i=>i.addEventListener("change",()=>{
  i.checked?state.layers.add(i.value):state.layers.delete(i.value); render();
}));
function fitCity(){
  const pts = ROWS.filter(r=>r.c===state.city).flatMap(r=>BOUNDS[r.h]);
  map.fitBounds(L.latLngBounds(pts),{padding:[24,24]});
}
fitCity();
render();
</script>
</body>
</html>
